<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101217'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%235aa7ff'/%3E%3Cpath d='M17 8h7v16H8v-7h9z' fill='%2342c987'/%3E%3C/svg%3E"
    />

    <!-- Template-specific tags. Daptin renders these Go-template directives before serving /d/:username/:slug. -->
    <!-- {{if .document}} -->
      <title>{{if .share_meta.title}}{{ .share_meta.title }}{{else}}{{if .slug}}{{ .slug }}{{else}}{{ (index .document 0).document_name }}{{end}}{{end}} | Canaster</title>
      <meta name="description" content="{{if .share_meta.description}}{{ .share_meta.description }}{{else}}Open this Canaster workspace.{{end}}" />
      <meta name="author" content="{{ .share_meta.author }}" />
      <meta name="robots" content="index,follow" />
      <link rel="canonical" href="%VITE_CANASTER_PUBLIC_ORIGIN%/d/{{ .username }}/{{ .slug }}" />
      <meta property="og:type" content="article" />
      <meta property="og:site_name" content="Canaster" />
      <meta property="og:title" content="{{if .share_meta.title}}{{ .share_meta.title }}{{else}}{{if .slug}}{{ .slug }}{{else}}{{ (index .document 0).document_name }}{{end}}{{end}}" />
      <meta property="og:description" content="{{if .share_meta.description}}{{ .share_meta.description }}{{else}}Open this Canaster workspace.{{end}}" />
      <meta property="og:url" content="%VITE_CANASTER_PUBLIC_ORIGIN%/d/{{ .username }}/{{ .slug }}" />
      <meta property="og:image" content="{{if .share_meta.image_asset_id}}%VITE_DAPTIN_ENDPOINT%/asset/asset/{{ .share_meta.image_asset_id }}/file{{else}}%VITE_CANASTER_OG_IMAGE_URL%{{end}}" />
      <meta property="og:image:alt" content="{{if .share_meta.title}}{{ .share_meta.title }}{{else}}Canaster workspace{{end}} preview" />
      <!-- {{if .share_meta.image_width}} -->
        <meta property="og:image:width" content="{{ .share_meta.image_width }}" />
      <!-- {{end}} -->
      <!-- {{if .share_meta.image_height}} -->
        <meta property="og:image:height" content="{{ .share_meta.image_height }}" />
      <!-- {{end}} -->
      <!-- {{if .share_meta.published_at}} -->
        <meta property="article:published_time" content="{{ .share_meta.published_at }}" />
      <!-- {{end}} -->
      <!-- {{if .share_meta.updated_at}} -->
        <meta property="article:modified_time" content="{{ .share_meta.updated_at }}" />
      <!-- {{end}} -->
      <!-- {{if .share_meta.author}} -->
        <meta property="article:author" content="{{ .share_meta.author }}" />
      <!-- {{end}} -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="{{if .share_meta.title}}{{ .share_meta.title }}{{else}}{{if .slug}}{{ .slug }}{{else}}{{ (index .document 0).document_name }}{{end}}{{end}}" />
      <meta name="twitter:description" content="{{if .share_meta.description}}{{ .share_meta.description }}{{else}}Open this Canaster workspace.{{end}}" />
      <meta name="twitter:image" content="{{if .share_meta.image_asset_id}}%VITE_DAPTIN_ENDPOINT%/asset/asset/{{ .share_meta.image_asset_id }}/file{{else}}%VITE_CANASTER_OG_IMAGE_URL%{{end}}" />
    <!-- {{end}} -->
    <!-- {{if not .document}} -->
      <title>Canaster</title>
      <meta name="description" content="Canaster is a nested visual workspace for practical documents." />
      <meta name="robots" content="noindex,nofollow" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Canaster" />
      <meta property="og:title" content="Canaster" />
      <meta property="og:description" content="Canaster is a nested visual workspace for practical documents." />
      <meta property="og:image" content="%VITE_CANASTER_OG_IMAGE_URL%" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Canaster" />
      <meta name="twitter:description" content="Canaster is a nested visual workspace for practical documents." />
      <meta name="twitter:image" content="%VITE_CANASTER_OG_IMAGE_URL%" />
    <!-- {{end}} -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
