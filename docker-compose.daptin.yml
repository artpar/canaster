name: canaster

services:
  daptin:
    image: daptin/daptin:v0.12.22
    working_dir: /opt/daptin
    entrypoint:
      - /opt/daptin/daptin
    environment:
      DAPTIN_SCHEMA_FOLDER: /opt/daptin/schema
      DAPTIN_STORAGE: /data/storage
    command:
      - -runtime
      - release
      - -port
      - ":8080"
      - -db_type
      - postgres
      - -db_connection_string
      - host=postgres user=canaster password=canaster dbname=canaster sslmode=disable
      - -local_storage_path
      - /data/storage
      - -olric_env
      - local
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "6336:8080"
      - "6443:6443"
      - "993:993"
    dns:
      - 127.0.0.1
    extra_hosts:
      - "canaster.local:127.0.0.1"
      - "mail.canaster.local:127.0.0.1"
      - "imap.canaster.local:127.0.0.1"
    volumes:
      - ./.tmp/daptin/local-schema:/opt/daptin/schema:ro
      - daptin-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  local-dns:
    image: coredns/coredns:1.11.3
    command:
      - -conf
      - /etc/coredns/Corefile
    network_mode: "service:daptin"
    volumes:
      - ./daptin/local-dns/Corefile:/etc/coredns/Corefile:ro
      - ./daptin/local-dns/canaster.local.db:/zones/canaster.local.db:ro
    depends_on:
      - daptin

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: canaster
      POSTGRES_PASSWORD: canaster
      POSTGRES_DB: canaster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canaster -d canaster"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  daptin-data:
  postgres-data:
