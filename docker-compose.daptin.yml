name: canaster

services:
  daptin:
    image: daptin/daptin:v0.12.19
    working_dir: /opt/daptin
    entrypoint:
      - /opt/daptin/daptin
    environment:
      DAPTIN_SCHEMA_FOLDER: /opt/daptin/schema
      DAPTIN_STORAGE: /data/storage
    command:
      - -runtime
      - release
      - -port
      - ":8080"
      - -db_type
      - postgres
      - -db_connection_string
      - host=postgres user=canaster password=canaster dbname=canaster sslmode=disable
      - -local_storage_path
      - /data/storage
      - -olric_env
      - local
    ports:
      - "6336:8080"
      - "6443:6443"
      - "993:993"
    volumes:
      - ./daptin:/opt/daptin/schema:ro
      - daptin-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: canaster
      POSTGRES_PASSWORD: canaster
      POSTGRES_DB: canaster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canaster -d canaster"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  daptin-data:
  postgres-data:
