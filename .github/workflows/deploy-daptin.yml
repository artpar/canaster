name: Deploy Canaster Backend On Google Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_SQL_CONNECTION_NAME: ${{ vars.GCP_SQL_CONNECTION_NAME }}
      GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
      DAPTIN_SITE_STORE: ${{ vars.DAPTIN_SITE_STORE }}
      DAPTIN_SITE_PATH: ${{ vars.DAPTIN_SITE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci

      - name: Build and publish Daptin image
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$GCP_ARTIFACT_REPOSITORY/daptin:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit \
            --project "$GCP_PROJECT" \
            --config deploy/gcp/cloudbuild-daptin.yaml \
            --substitutions "_IMAGE=$IMAGE" \
            .

      - name: Deploy Daptin to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --service-account "canaster-daptin-run@$GCP_PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen2 \
            --no-invoker-iam-check \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --set-cloudsql-instances "$GCP_SQL_CONNECTION_NAME" \
            --set-secrets DAPTIN_DB_CONNECTION_STRING=canaster-daptin-db-connection:latest \
            --set-env-vars DAPTIN_SCHEMA_FOLDER=/opt/canaster/schema,DAPTIN_LOCAL_STORAGE_PATH=/data/storage,DAPTIN_STORAGE=/data/storage \
            --add-volume name=daptin-storage,type=cloud-storage,bucket="$GCP_STORAGE_BUCKET" \
            --add-volume-mount volume=daptin-storage,mount-path=/data/storage

      - name: Resolve Daptin endpoint
        run: |
          set -euo pipefail
          DAPTIN_ENDPOINT="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT" --format='value(status.url)')"
          echo "DAPTIN_ENDPOINT=$DAPTIN_ENDPOINT" >> "$GITHUB_ENV"

      - name: Build frontend for deployed Daptin
        run: |
          set -euo pipefail
          VITE_DAPTIN_ENDPOINT="$DAPTIN_ENDPOINT" VITE_CANASTER_STORAGE_MODE=daptin npm run build

      - name: Install Daptin CLI
        run: go install github.com/daptin/daptin-cli@latest

      - name: Authenticate Daptin CLI
        env:
          DAPTIN_CLI_CONFIG: ${{ runner.temp }}/daptin-cli.yaml
          DAPTIN_ADMIN_EMAIL: ${{ secrets.DAPTIN_ADMIN_EMAIL }}
          DAPTIN_ADMIN_PASSWORD: ${{ secrets.DAPTIN_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          daptin-cli context add prod "$DAPTIN_ENDPOINT"
          daptin-cli context set prod
          daptin-cli execute user_account signin "email=$DAPTIN_ADMIN_EMAIL" "password=$DAPTIN_ADMIN_PASSWORD"

      - name: Upload frontend to Daptin site storage
        env:
          DAPTIN_CLI_CONFIG: ${{ runner.temp }}/daptin-cli.yaml
        run: |
          set -euo pipefail
          daptin-cli storage upload "$DAPTIN_SITE_STORE:$DAPTIN_SITE_PATH" ./dist --recursive

      - name: Smoke deployed runtime
        run: |
          set -euo pipefail
          curl -fsS "$DAPTIN_ENDPOINT/api/world?page%5Bsize%5D=1" >/dev/null
