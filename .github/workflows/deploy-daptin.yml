name: Deploy Canaster Backend On Google Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
      GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
      GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
      DAPTIN_SITE_PATH: ${{ vars.DAPTIN_SITE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci

      - name: Build and publish Daptin image
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$GCP_ARTIFACT_REPOSITORY/daptin:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_PROJECT" \
            --config deploy/gcp/cloudbuild-daptin.yaml \
            --substitutions "_IMAGE=$IMAGE" \
            --async \
            --format='value(id)' \
            --suppress-logs \
            .)"
          echo "Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project "$GCP_PROJECT" --format='value(status)')"
            echo "Cloud Build status: $STATUS"
            case "$STATUS" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

      - name: Build frontend for production Daptin
        run: |
          set -euo pipefail
          VITE_DAPTIN_ENDPOINT="https://api.canaster.in" VITE_CANASTER_STORAGE_MODE=daptin npm run build

      - name: Upload frontend to site storage
        run: |
          set -euo pipefail
          SITE_PATH="${DAPTIN_SITE_PATH#/}"
          SITE_URI="gs://$GCP_STORAGE_BUCKET/$SITE_PATH"
          gcloud storage rsync ./dist "$SITE_URI" --recursive --delete-unmatched-destination-objects
          gcloud storage ls "$SITE_URI/index.html" >/dev/null

      - name: Deploy Daptin to VM
        run: |
          set -euo pipefail
          gcloud compute scp deploy/gcp/vm-deploy-image.sh "$GCP_VM_NAME:/tmp/vm-deploy-image.sh" \
            --zone "$GCP_VM_ZONE" \
            --project "$GCP_PROJECT" \
            --tunnel-through-iap
          gcloud compute ssh "$GCP_VM_NAME" \
            --zone "$GCP_VM_ZONE" \
            --project "$GCP_PROJECT" \
            --tunnel-through-iap \
            --command "sudo install -m 0755 /tmp/vm-deploy-image.sh /opt/canaster/bin/deploy-image.sh && sudo /opt/canaster/bin/deploy-image.sh '$IMAGE'"

      - name: Resolve VM endpoint
        run: |
          set -euo pipefail
          VM_IP="$(gcloud compute instances describe "$GCP_VM_NAME" --zone "$GCP_VM_ZONE" --project "$GCP_PROJECT" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          echo "VM_IP=$VM_IP" >> "$GITHUB_ENV"

      - name: Smoke deployed runtime
        run: |
          set -euo pipefail
          curl -fsS -H "Host: api.canaster.in" "http://$VM_IP/api/world?page%5Bsize%5D=1" >/dev/null
