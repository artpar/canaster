name: Deploy Canaster Backend On Google Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_SQL_CONNECTION_NAME: ${{ vars.GCP_SQL_CONNECTION_NAME }}
      GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
      DAPTIN_SITE_STORE: ${{ vars.DAPTIN_SITE_STORE }}
      DAPTIN_SITE_PATH: ${{ vars.DAPTIN_SITE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci

      - name: Build and publish Daptin image
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$GCP_ARTIFACT_REPOSITORY/daptin:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit \
            --project "$GCP_PROJECT" \
            --config deploy/gcp/cloudbuild-daptin.yaml \
            --substitutions "_IMAGE=$IMAGE" \
            --async \
            --format='value(id)' \
            --suppress-logs \
            .)"
          echo "Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project "$GCP_PROJECT" --format='value(status)')"
            echo "Cloud Build status: $STATUS"
            case "$STATUS" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

      - name: Deploy Daptin to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --service-account "canaster-daptin-run@$GCP_PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen2 \
            --no-invoker-iam-check \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --set-cloudsql-instances "$GCP_SQL_CONNECTION_NAME" \
            --set-secrets DAPTIN_DB_CONNECTION_STRING=canaster-daptin-db-connection:latest \
            --set-env-vars DAPTIN_SCHEMA_FOLDER=/opt/canaster/schema,DAPTIN_LOCAL_STORAGE_PATH=/data/storage,DAPTIN_STORAGE=/data/storage \
            --add-volume name=daptin-storage,type=cloud-storage,bucket="$GCP_STORAGE_BUCKET" \
            --add-volume-mount volume=daptin-storage,mount-path=/data/storage

      - name: Resolve Daptin endpoint
        run: |
          set -euo pipefail
          DAPTIN_ENDPOINT="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT" --format='value(status.url)')"
          echo "DAPTIN_ENDPOINT=$DAPTIN_ENDPOINT" >> "$GITHUB_ENV"

      - name: Build frontend for production Daptin
        run: |
          set -euo pipefail
          VITE_DAPTIN_ENDPOINT="https://api.canaster.in" VITE_CANASTER_STORAGE_MODE=daptin npm run build

      - name: Upload frontend to site storage
        run: |
          set -euo pipefail
          SITE_PATH="${DAPTIN_SITE_PATH#/}"
          SITE_URI="gs://$GCP_STORAGE_BUCKET/$SITE_PATH"
          gcloud storage rsync ./dist "$SITE_URI" --recursive --delete-unmatched-destination-objects
          gcloud storage ls "$SITE_URI/index.html" >/dev/null

      - name: Refresh Daptin site cache
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --update-env-vars CANASTER_SITE_RELOAD_MARKER="$(date +%s)"

      - name: Smoke deployed runtime
        run: |
          set -euo pipefail
          curl -fsS "$DAPTIN_ENDPOINT/api/world?page%5Bsize%5D=1" >/dev/null
