Actions:
  - Name: request_canaster_email_otp
    Label: Request Canaster email sign-in code
    OnType: user_account
    InstanceOptional: true
    Permission: 32
    Conformations:
      - ColumnName: email
        Tags: email,lower
    InFields:
      - ColumnName: email
        ColumnType: email
        IsNullable: false
        Name: email
    OutFields:
      - Type: user_account
        Method: GET
        Reference: user
        SkipInResponse: true
        Attributes:
          query: '[{"column": "email", "operator": "is", "value": "$email"}]'
      - Type: user_account
        Method: POST
        Reference: new_user
        Condition: '!user == null || user.length == 0'
        SkipInResponse: true
        Attributes:
          confirmed: '0'
          email: ~email
          name: '!email.split("@")[0]'
      - Type: user_account
        Method: PATCH
        Reference: new_user_owner
        Condition: '!user == null || user.length == 0'
        SkipInResponse: true
        Attributes:
          reference_id: '$new_user.reference_id'
          user_account_id: '$new_user.reference_id'
          permission: 569633
      - Type: user_account
        Method: PATCH
        Reference: existing_user_permission
        Condition: '!user != null && user.length > 0 && (user[0].permission & 8192) == 0'
        SkipInResponse: true
        Attributes:
          reference_id: '$user[0].reference_id'
          permission: '!user[0].permission | 8192'
      - Type: __as_user
        Method: SWITCH_USER
        SkipInResponse: true
        Attributes:
          user_reference_id: '!user && user.length > 0 ? user[0].reference_id : new_user.reference_id'
      - Type: otp.generate
        Method: EXECUTE
        Reference: otp
        SkipInResponse: true
        Attributes:
          email: ~email
      - Type: mail.send
        Method: EXECUTE
        SkipInResponse: true
        Attributes:
          body: '!"Your Canaster sign-in code is " + otp.otp + ". It is valid for 5 minutes."'
          to:
            - '~email'
          subject: 'Your Canaster sign-in code'
          from: 'login@mail.canaster.in'
          mail_server_hostname: 'mail.canaster.in'
          send_immediately: true
      - Type: client.notify
        Method: ACTIONRESPONSE
        Attributes:
          type: success
          title: Code sent
          message: Check your email for the sign-in code.
    Validations:
      - ColumnName: email
        Tags: email

  - Name: verify_canaster_email_otp
    Label: Verify Canaster email sign-in code
    OnType: user_account
    InstanceOptional: true
    Permission: 32
    Conformations:
      - ColumnName: email
        Tags: email,lower
    InFields:
      - ColumnName: email
        ColumnType: email
        IsNullable: false
        Name: email
      - ColumnName: otp
        ColumnType: label
        IsNullable: false
        Name: otp
    OutFields:
      - Type: user_account
        Method: GET
        Reference: user
        SkipInResponse: true
        Attributes:
          query: '[{"column": "email", "operator": "is", "value": "$email"}]'
      - Type: otp.login.verify
        Method: EXECUTE
        Reference: otp_session
        Attributes:
          email: ~email
          otp: ~otp
      - Type: __as_user
        Method: SWITCH_USER
        SkipInResponse: true
        Attributes:
          user_reference_id: '$user[0].reference_id'
      - Type: mail_server
        Method: GET
        Reference: canaster_mail_server
        SkipInResponse: true
        Attributes:
          query: '[{"column": "hostname", "operator": "is", "value": "mail.canaster.in"}, {"column": "listen_interface", "operator": "is", "value": "0.0.0.0:465"}]'
      - Type: mail_account
        Method: GET
        Reference: existing_mail_account
        SkipInResponse: true
        Attributes:
          query: '[{"column": "username", "operator": "is", "value": "$email"}]'
      - Type: mail_account
        Method: POST
        Reference: mail_account
        Condition: '!existing_mail_account == null || existing_mail_account.length == 0'
        SkipInResponse: true
        Attributes:
          username: ~email
          password: '!"cm-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 14)'
          password_md5: '!"cmm-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 14)'
          mail_server_id: '$canaster_mail_server[0].reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: GET
        Reference: existing_mail_boxes
        SkipInResponse: true
        Attributes:
          query: '!JSON.stringify([{"column": "mail_account_id", "operator": "is", "value": existing_mail_account != null && existing_mail_account.length > 0 ? existing_mail_account[0].reference_id : mail_account.reference_id}])'
      - Type: mail_box
        Method: POST
        Reference: inbox_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "INBOX"; })'
        SkipInResponse: true
        Attributes:
          name: INBOX
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: POST
        Reference: draft_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Draft"; })'
        SkipInResponse: true
        Attributes:
          name: Draft
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: POST
        Reference: sent_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Sent"; })'
        SkipInResponse: true
        Attributes:
          name: Sent
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: POST
        Reference: archive_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Archive"; })'
        SkipInResponse: true
        Attributes:
          name: Archive
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: POST
        Reference: trash_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Trash"; })'
        SkipInResponse: true
        Attributes:
          name: Trash
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
      - Type: mail_box
        Method: POST
        Reference: spam_mail_box
        Condition: '!existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Spam"; })'
        SkipInResponse: true
        Attributes:
          name: Spam
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(existing_mail_account != null && existing_mail_account.length > 0) ? existing_mail_account[0].reference_id : mail_account.reference_id'
          user_account_id: '$user[0].reference_id'
    Validations:
      - ColumnName: email
        Tags: email
