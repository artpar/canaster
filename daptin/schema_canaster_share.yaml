Actions:
  - Name: get_canaster_document_by_public_path
    OnType: document
    InstanceOptional: true
    Label: Get Canaster document by public path
    Permission: 2085152
    InFields:
      - ColumnName: username
        Name: username
        IsNullable: false
      - ColumnName: slug
        Name: slug
        IsNullable: false
    OutFields:
      - Type: document
        Method: GET
        Reference: document
        SkipInResponse: false
        Attributes:
          query: '!JSON.stringify([{"column": "document_name", "operator": "is", "value": username + "/" + slug + ".canaster.json"}, {"column": "document_extension", "operator": "is", "value": "json"}])'
