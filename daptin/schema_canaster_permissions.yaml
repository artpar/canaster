Tables:
  # Public auth uses action-level GuestExecute on the two OTP actions only.
  # These table permissions intentionally allow guest Execute without guest
  # Peek/Read/Create/Update/Delete so password auth and table CRUD stay closed.
  - TableName: user_account
    Permission: 561440

  # Application-owned user data.
  # GuestExecute is required for Daptin routed templates whose action_config
  # executes document actions; action rows still gate which document actions
  # guests can actually run.
  - TableName: document
    Permission: 1003811
    DefaultPermission: 16256
    AccessGroups:
      - Name: users
        Permission: 999424

  - TableName: asset
    Permission: 741632
    DefaultPermission: 16256
    AccessGroups:
      - Name: users
        Permission: 770048

  - TableName: mail
    Permission: 561408
    AccessGroups:
      - Name: users
        Permission: 573440

  # Runtime mail queues and operational tables stay closed to guest CRUD.
  - TableName: outbox
    Permission: 561408

  - TableName: credential
    Permission: 561408

  - TableName: certificate
    Permission: 561408

  - TableName: user_otp_account
    Permission: 561408

  - TableName: mail_account
    Permission: 577792
    DefaultPermission: 569633
    AccessGroups:
      - Name: users
        Permission: 573440

  - TableName: mail_box
    Permission: 577792
    DefaultPermission: 569633
    AccessGroups:
      - Name: users
        Permission: 573440

  - TableName: mail_server
    Permission: 561408

  # Admin-managed Daptin system tables used by deployment/provisioning.
  # These remain closed to guests; administrators get full table access through
  # their usergroup relation so daptin-cli can manage runtime rows.
  - TableName: action
    Permission: 2085120
    DefaultGroups:
      - Name: administrators
        Permission: 2097151

  - TableName: template
    Permission: 2085120
    DefaultGroups:
      - Name: administrators
        Permission: 2097151

  - TableName: site
    Permission: 2085120
    DefaultGroups:
      - Name: administrators
        Permission: 2097151

  - TableName: user_account_user_account_id_has_usergroup_usergroup_id
    Permission: 2085120
    DefaultGroups:
      - Name: administrators
        Permission: 2097151
