Actions:
  - Name: set_canaster_mail_username
    Label: Set Canaster mail username
    OnType: user_account
    InstanceOptional: true
    Permission: 2085120
    AccessGroups:
      - Name: users
        Permission: 524288
    Conformations:
      - ColumnName: username
        Tags: lower
    InFields:
      - ColumnName: username
        ColumnType: label
        IsNullable: false
        Name: username
    OutFields:
      - Type: mail_account
        Method: GET
        Reference: own_mail_account
        SkipInResponse: true
        Attributes:
          query: '!JSON.stringify([{"column": "user_account_id", "operator": "is", "value": user.reference_id.toString()}])'
      - Type: mail_account
        Method: GET
        Reference: requested_mail_account
        SkipInResponse: true
        Attributes:
          query: '!JSON.stringify([{"column": "username", "operator": "is", "value": username + "@canaster.in"}])'
      - Type: mail_server
        Method: GET
        Reference: canaster_mail_server
        SkipInResponse: true
        Attributes:
          query: '[{"column": "hostname", "operator": "is", "value": "mail.canaster.in"}]'
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!username == null || !username.match(/^[a-z0-9._-]{5,}$/)'
        SkipInResponse: false
        Attributes:
          type: error
          message: Use at least 5 letters, numbers, dots, dashes, or underscores.
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && requested_mail_account != null && requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })'
        SkipInResponse: false
        Attributes:
          type: error
          message: That Canaster mail username is not available.
      - Type: mail_account
        Method: PATCH
        Reference: updated_mail_account
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && own_mail_account != null && own_mail_account.length > 0'
        SkipInResponse: true
        Attributes:
          reference_id: '$own_mail_account[0].reference_id'
          username: '!username + "@canaster.in"'
      - Type: mail_account
        Method: POST
        Reference: created_mail_account
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (own_mail_account == null || own_mail_account.length == 0)'
        SkipInResponse: true
        Attributes:
          username: '!username + "@canaster.in"'
          password: '!"cm-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 14)'
          password_md5: '!"cmm-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 14)'
          mail_server_id: '$canaster_mail_server[0].reference_id'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: GET
        Reference: existing_mail_boxes
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); }))'
        SkipInResponse: true
        Attributes:
          query: '!JSON.stringify([{"column": "mail_account_id", "operator": "is", "value": own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString()}])'
      - Type: mail_box
        Method: POST
        Reference: inbox_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "INBOX"; }))'
        SkipInResponse: true
        Attributes:
          name: INBOX
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: POST
        Reference: draft_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Draft"; }))'
        SkipInResponse: true
        Attributes:
          name: Draft
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: POST
        Reference: sent_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Sent"; }))'
        SkipInResponse: true
        Attributes:
          name: Sent
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: POST
        Reference: archive_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Archive"; }))'
        SkipInResponse: true
        Attributes:
          name: Archive
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: POST
        Reference: trash_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Trash"; }))'
        SkipInResponse: true
        Attributes:
          name: Trash
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: mail_box
        Method: POST
        Reference: spam_mail_box
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); })) && (existing_mail_boxes == null || !existing_mail_boxes.some(function(box) { return box.name == "Spam"; }))'
        SkipInResponse: true
        Attributes:
          name: Spam
          subscribed: true
          uidvalidity: '!Math.floor(Date.now() / 1000)'
          nextuid: 1
          attributes: ''
          flags: '\*'
          permanent_flags: '\*'
          mail_account_id: '!(own_mail_account != null && own_mail_account.length > 0 ? own_mail_account[0].reference_id.toString() : created_mail_account.reference_id.toString())'
          user_account_id: '$user.reference_id'
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!username != null && username.match(/^[a-z0-9._-]{5,}$/) && (requested_mail_account == null || !requested_mail_account.some(function(account) { return account.user_account_id.toString() != user.reference_id.toString(); }))'
        SkipInResponse: false
        Attributes:
          type: success
          title: Mail address saved
          message: Mail address saved.

  - Name: send_canaster_mail
    Label: Send Canaster mail
    OnType: mail_account
    InstanceOptional: false
    Permission: 2085120
    AccessGroups:
      - Name: users
        Permission: 524288
    InFields:
      - ColumnName: to
        ColumnType: content
        IsNullable: false
        Name: to
      - ColumnName: cc
        ColumnType: content
        IsNullable: true
        Name: cc
      - ColumnName: bcc
        ColumnType: content
        IsNullable: true
        Name: bcc
      - ColumnName: mail_subject
        ColumnType: label
        IsNullable: false
        Name: mail_subject
      - ColumnName: body
        ColumnType: content
        IsNullable: false
        Name: body
    OutFields:
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!subject.user_account_id.toString() != user.reference_id.toString()'
        SkipInResponse: false
        Attributes:
          type: error
          message: Only the account owner can send mail from this mailbox.
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!subject.user_account_id.toString() == user.reference_id.toString() && !subject.username.match(/^[a-z0-9._-]{5,}@canaster\.(in|local)$/)'
        SkipInResponse: false
        Attributes:
          type: error
          message: Use your Canaster mail address to send mail.
      - Type: mail.send
        Method: EXECUTE
        Condition: '!subject.user_account_id.toString() == user.reference_id.toString() && subject.username.match(/^[a-z0-9._-]{5,}@canaster\.(in|local)$/)'
        SkipInResponse: true
        Attributes:
          body: ~body
          to: '!(to || "").split(/[,\n;]/).map(function(value) { return value.trim(); }).filter(Boolean)'
          cc: '!(cc || "").split(/[,\n;]/).map(function(value) { return value.trim(); }).filter(Boolean)'
          bcc: '!(bcc || "").split(/[,\n;]/).map(function(value) { return value.trim(); }).filter(Boolean)'
          subject: ~mail_subject
          from: '!subject.username'
          mail_server_hostname: 'mail.canaster.in'
          send_immediately: true
      - Type: client.notify
        Method: ACTIONRESPONSE
        Condition: '!subject.user_account_id.toString() == user.reference_id.toString() && subject.username.match(/^[a-z0-9._-]{5,}@canaster\.(in|local)$/)'
        SkipInResponse: false
        Attributes:
          type: success
          title: Message sent
          message: Message sent.

Tables:
  - TableName: mail_account
    DefaultPermission: 12672

  - TableName: mail_box
    DefaultPermission: 12672

  - TableName: world_world_id_has_usergroup_usergroup_id
    DefaultPermission: 638976

  - TableName: mail
    Permission: 561408
    Columns:
      - Name: mail
        ColumnName: mail
        DataType: blob
        ColumnType: gzip
        IsForeignKey: true
        ForeignKeyData:
          DataSource: cloud_store
          Namespace: canaster-mail
          KeyName: mail-messages

  - TableName: outbox
    Columns:
      - Name: mail
        ColumnName: mail
        DataType: blob
        ColumnType: gzip
        IsForeignKey: true
        ForeignKeyData:
          DataSource: cloud_store
          Namespace: canaster-mail
          KeyName: outbox-messages
